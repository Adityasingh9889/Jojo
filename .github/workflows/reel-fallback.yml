name: Free Reel Fallback

on:
  push:
    paths:
      - "creator/input.json"
      - "scripts/render_reel.py"
      - ".github/workflows/reel-fallback.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: free-reel-fallback
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check input
        id: input
        shell: bash
        run: |
          if [ ! -s creator/input.json ]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "No creator/input.json yet; skipping."
          else
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate input
        if: steps.input.outputs.valid == 'true'
        run: |
          python scripts/render_reel.py --validate creator/input.json

      - name: Render 9:16 Reel
        if: steps.input.outputs.valid == 'true'
        run: |
          mkdir -p creator/output
          python scripts/render_reel.py --render creator/input.json --output creator/output/latest.mp4

      - name: Verify output
        if: steps.input.outputs.valid == 'true'
        run: |
          test -s creator/output/latest.mp4
          ffprobe -v error -show_entries format=duration:stream=width,height,codec_name -of default=noprint_wrappers=1 creator/output/latest.mp4

      - name: Commit latest Reel
        if: steps.input.outputs.valid == 'true'
        run: |
          git config user.name "Jojo Reel Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add creator/output/latest.mp4 creator/input.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "🎬 render free fallback reel"
          git push
