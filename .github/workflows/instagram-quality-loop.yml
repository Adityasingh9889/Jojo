name: Instagram Verified Quality Loop

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-verified-quality-loop
  cancel-in-progress: true

jobs:
  quality-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Validate required configuration
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$IG_USER_ID" || (echo "Missing IG_USER_ID secret" && exit 1)
          test -n "$META_ACCESS_TOKEN" || (echo "Missing META_ACCESS_TOKEN secret" && exit 1)
          test -n "$OPENAI_API_KEY" || (echo "Missing OPENAI_API_KEY secret" && exit 1)
          test -s creator/publish.json

      - name: Render + publish + inspect + delete/rebuild loop
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_QA_MODEL: ${{ vars.OPENAI_QA_MODEL }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
          PUBLISH_SOURCE_TEMPLATE: "https://raw.githubusercontent.com/Adityasingh9889/Jojo/main/creator/qa_runs/candidate_{iteration}.mp4"
          QA_MAX_ITERATIONS: "6"
          QA_MIN_SCORE: "9.2"
        run: |
          python scripts/instagram_quality_loop_v2.py --config creator/publish.json

      - name: Persist winning recipe
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          winner = Path("creator/qa_runs/WINNER.json")
          profile = Path("creator/qa_profile.json")
          if winner.exists() and profile.exists():
              w = json.loads(winner.read_text())
              p = json.loads(profile.read_text())
              p.setdefault("approved_examples", [])
              p.setdefault("last_verified_winner", {})
              p["approved_examples"].append({
                  "iteration": w.get("iteration"),
                  "score": w.get("score"),
                  "defects_fixed": w.get("review", {}).get("critical_defects", []),
                  "recipe_variant": w.get("published", {}).get("media_type"),
                  "media_id": w.get("media_id")
              })
              p["last_verified_winner"] = {
                  "iteration": w.get("iteration"),
                  "score": w.get("score"),
                  "media_id": w.get("media_id")
              }
              profile.write_text(json.dumps(p, indent=2) + "\n")
          PY

      - name: Save QA memory
        if: always()
        run: |
          mkdir -p creator/qa_runs
          git config user.name "Jojo QA Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add creator/qa_runs creator/publish.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "🧪 save Instagram QA loop results"
          git push || true
