name: Daily Random Project

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate today's project
        run: python scripts/daily_project.py
      - name: Commit and push
        run: |
          git config user.name "Jojo Daily Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "🤖 daily project: $(date -u +%Y-%m-%d)"
          git push
