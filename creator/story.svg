<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b14"/>
      <stop offset="0.58" stop-color="#0a1a2d"/>
      <stop offset="1" stop-color="#02050a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3858" stop-opacity=".7"/>
      <stop offset="1" stop-color="#07121f" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2038"/>
      <stop offset="1" stop-color="#040a12"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="13"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>

  <!-- Rainy window -->
  <rect x="55" y="85" width="970" height="1030" rx="28" fill="url(#glass)" stroke="#385676" stroke-opacity=".45"/>
  <g opacity=".28" filter="url(#blur)">
    <rect x="90" y="530" width="160" height="360" fill="#2aa7ff"/>
    <rect x="285" y="390" width="140" height="500" fill="#8b6cff"/>
    <rect x="460" y="470" width="205" height="420" fill="#44d7ff"/>
    <rect x="700" y="350" width="125" height="540" fill="#2e8fff"/>
    <rect x="860" y="445" width="110" height="445" fill="#7b61ff"/>
  </g>
  <g fill="#d8ecff" opacity=".55">
    <circle cx="162" cy="514" r="6"/><circle cx="310" cy="432" r="5"/><circle cx="500" cy="520" r="7"/>
    <circle cx="733" cy="406" r="5"/><circle cx="902" cy="492" r="6"/>
  </g>
  <g stroke="#b8d9f0" stroke-opacity=".32" stroke-width="5" stroke-linecap="round">
    <path d="M135 160 l-28 110"/><path d="M238 190 l-35 138"/><path d="M380 124 l-25 90"/>
    <path d="M555 210 l-34 145"/><path d="M702 155 l-24 96"/><path d="M840 180 l-36 140"/><path d="M936 130 l-32 124"/>
  </g>

  <!-- Desk -->
  <path d="M0 1270 C260 1205 820 1205 1080 1280 L1080 1920 L0 1920 Z" fill="#05080e"/>
  <path d="M0 1305 C300 1260 780 1260 1080 1315" fill="none" stroke="#1d334d" stroke-width="10"/>

  <!-- Laptop glow -->
  <ellipse cx="566" cy="1460" rx="390" ry="115" fill="#52cfff" opacity=".12" filter="url(#glow)"/>
  <path d="M310 1115 Q550 1080 822 1130 L776 1515 Q545 1560 280 1500 Z" fill="#0b1018" stroke="#314862" stroke-width="8"/>
  <path d="M335 1150 Q550 1122 797 1158 L757 1456 Q548 1495 307 1455 Z" fill="url(#screen)" stroke="#1c7fa8" stroke-opacity=".42" stroke-width="5"/>

  <!-- Terminal/code -->
  <g font-family="monospace" font-size="26">
    <text x="360" y="1215" fill="#77e6ff">$ ip addr show</text>
    <text x="360" y="1255" fill="#89a8c6">inet 192.168.1.42/24</text>
    <text x="360" y="1295" fill="#62d9ff">$ ping 192.168.1.1</text>
    <text x="360" y="1335" fill="#91cfff">64 bytes: time=2.3 ms</text>
    <text x="360" y="1375" fill="#5ee5b8">$ git status</text>
    <text x="360" y="1415" fill="#7d93aa">working tree clean</text>
  </g>

  <!-- Keyboard base -->
  <path d="M245 1505 Q540 1568 835 1510 L955 1650 Q560 1745 125 1644 Z" fill="#090d14" stroke="#24384c" stroke-width="7"/>
  <g fill="#162739" opacity=".9">
    <rect x="260" y="1540" width="50" height="27" rx="4"/><rect x="320" y="1552" width="50" height="27" rx="4"/>
    <rect x="380" y="1564" width="50" height="27" rx="4"/><rect x="440" y="1574" width="50" height="27" rx="4"/>
    <rect x="500" y="1581" width="50" height="27" rx="4"/><rect x="560" y="1584" width="50" height="27" rx="4"/>
    <rect x="620" y="1578" width="50" height="27" rx="4"/><rect x="680" y="1569" width="50" height="27" rx="4"/>
    <rect x="740" y="1556" width="50" height="27" rx="4"/>
    <rect x="360" y="1620" width="360" height="32" rx="8" fill="#0e5f7b" opacity=".8"/>
  </g>

  <!-- Coffee -->
  <ellipse cx="165" cy="1500" rx="84" ry="24" fill="#10141b"/>
  <path d="M92 1500 Q92 1605 165 1625 Q238 1605 238 1500 Z" fill="#1a202a" stroke="#33485e" stroke-width="5"/>
  <ellipse cx="165" cy="1500" rx="74" ry="18" fill="#4b3728"/>
  <path d="M238 1530 Q290 1515 292 1555 Q290 1590 245 1587" fill="none" stroke="#33485e" stroke-width="12"/>
  <path d="M145 1462 C120 1410 165 1388 145 1340" fill="none" stroke="#b7d2df" stroke-opacity=".18" stroke-width="8"/>

  <!-- Small plant -->
  <path d="M880 1490 C858 1430 885 1380 895 1330" stroke="#427b5d" stroke-width="15" fill="none"/>
  <path d="M892 1400 C820 1384 814 1332 868 1345" fill="#326b52"/>
  <path d="M892 1360 C944 1325 980 1348 952 1380" fill="#3c805d"/>
  <path d="M894 1450 C835 1448 812 1408 856 1402" fill="#2d654b"/>
  <path d="M894 1424 C955 1400 988 1433 947 1460" fill="#3a7658"/>

  <!-- Minimal story title -->
  <rect x="88" y="116" width="904" height="170" rx="28" fill="#050a12" fill-opacity=".58" stroke="#4cc8ff" stroke-opacity=".30"/>
  <text x="132" y="188" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#f4fbff">late night • build mode</text>
  <text x="132" y="246" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#a9c8de">coding / learning / building</text>

  <text x="88" y="1840" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#aac4d6" opacity=".75">@aadityaxo</text>
</svg>
